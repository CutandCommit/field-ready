  <style>

  .week-nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 15px;gap:10px}.week-nav strong{font-size:16px}.arrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);width:42px;height:42px;font-size:23px}.arrow:disabled{opacity:.3;cursor:not-allowed}.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:13px 0 18px}.daybtn{display:flex;flex-direction:column;align-items:center;gap:7px;min-height:75px;border:1px solid var(--line);border-radius:15px;padding:11px 0 8px;background:var(--panel);color:var(--muted)}.daybtn strong{font-size:17px;color:var(--text)}.daybtn span{font-size:10px;font-weight:700}.daybtn.selected{background:var(--mint);color:var(--mintText);border-color:var(--mint)}.daybtn.selected strong{color:var(--mintText)}.day-dot{height:5px;width:5px;border-radius:999px;background:var(--muted)}.daybtn.selected .day-dot{background:var(--mintText)}.daybtn.done:not(.selected) .day-dot{background:var(--mint)}

  /* Nutrition log: compact inputs and glanceable mobile summaries */
  .food-hero{background:linear-gradient(135deg,#1a4137,#173237 82%);border-color:#426c60}
  .food-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}
  .food-stat{border:1px solid #355752;background:#132e31;padding:13px;border-radius:15px;min-width:0}
  .food-stat .amount{font-size:24px;font-weight:850;letter-spacing:-.5px;line-height:1.15}
  .food-stat .unit{font-size:12px;color:var(--muted);margin-left:3px}
  .food-stat .label{font-size:11px;margin-top:7px;color:var(--muted);font-weight:750}

  .food-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .food-form-grid .span-all{grid-column:1/-1}

  .food-quick{border:1px solid #345553;border-radius:13px;padding:10px 11px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}

  @media(min-width:560px){.food-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
  
  /* v6 guided workout, personal substitutions, cloud and update UI */
  .guide-progress{display:flex;gap:5px;margin:12px 0 18px}.guide-dot{height:7px;flex:1;border-radius:9px;background:#345054}.guide-dot.current{background:var(--mint)}.guide-dot.complete{background:#5d9a7d}

  .cloud-panel{border:1px solid #496964;background:#152d31;border-radius:19px;padding:18px;margin:14px 0}.cloud-panel h3{margin-bottom:8px}.cloud-status{font-size:12px;color:#b7d4d3;margin:8px 0}.cloud-danger{border-left:3px solid var(--orange);background:#3b3024;padding:12px;margin:12px 0;border-radius:0 10px 10px 0}.cloud-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.cloud-login{display:grid;gap:9px}.cloud-small{font-size:12px;color:var(--muted);line-height:1.5}

'use strict';

const STORAGE_KEY='field-ready-tracker-v1';

let swapTarget=null;
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_CODES=[['A'],['B','TUE'],['WED'],['C'],['D'],['SAT'],[]];
const SESSION_CODES=['A','B','TUE','WED','C','D','SAT'];
const SESSION_LABELS={A:'Lower Strength + Power',B:'Upper Push',C:'Lower Athletic',D:'Upper Pull',TUE:'Easy Cardio',WED:'Zone 2 Cardio',SAT:'Saturday Conditioning'};
const DAY_ICON={A:'⚡',B:'💪',C:'↗',D:'🏋️',TUE:'🚴',WED:'♡',SAT:'🔥'};
const CARDIO_INDEX={TUE:1,WED:0,SAT:2};
const NAV=[['today','⌂','Today'],['plan','▦','Plan'],['food','🥗','Food'],['progress','↗','Progress'],['more','⚙','More']];
function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function toDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12)}
function plusDays(s,days){const d=toDate(s);d.setDate(d.getDate()+days);return iso(d)}
function dayDiff(a,b){return Math.round((Date.UTC(...a.split('-').map((x,i)=>i===1?Number(x)-1:Number(x)))-Date.UTC(...b.split('-').map((x,i)=>i===1?Number(x)-1:Number(x))))/86400000)}
function mondayOf(s){const d=toDate(s);return plusDays(s,-(d.getDay()+6)%7)}
function pretty(s,opt={month:'short',day:'numeric'}){return toDate(s).toLocaleDateString('en-US',opt)}
function h(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cap(n,lo,hi){return Math.min(hi,Math.max(lo,n))}
function initial(){const today=iso(new Date());return {version:1,startDate:mondayOf(today),week:1,day:((toDate(today).getDay()+6)%7),view:'today',logs:{},weekSchedules:{},weights:[],goalWeight:'',name:'',foodDate:today,foods:[],nutritionGoals:{calories:'',protein:''},exerciseLibrary:[],guideIndex:0,restPreset:90}}
let state;
try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY));state=Object.assign(initial(),stored&&typeof stored==='object'?stored:{});if(!state.logs||typeof state.logs!=='object')state.logs={};if(!state.weekSchedules||typeof state.weekSchedules!=='object'||Array.isArray(state.weekSchedules))state.weekSchedules={};if(!Array.isArray(state.weights))state.weights=[];if(!Array.isArray(state.foods))state.foods=[];if(!Array.isArray(state.exerciseLibrary))state.exerciseLibrary=[];if(![60,90,120,180].includes(Number(state.restPreset)))state.restPreset=90;if(!state.nutritionGoals||typeof state.nutritionGoals!=='object')state.nutritionGoals={calories:'',protein:''};if(!/^\d{4}-\d{2}-\d{2}$/.test(state.foodDate||''))state.foodDate=iso(new Date())}catch(e){state=initial()}
state.week=cap(Number(state.week)||1,1,12);state.day=cap(Number(state.day)||0,0,6);
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));window.FieldReadyCloud?.queueSave?.()}catch(e){toast('Unable to save. Export a backup.')}}
function toast(msg){const t=document.getElementById('snack');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>t.classList.remove('show'),2100)}
function key(w,code){return `${w}|${code}`}
function weekDate(w,d=0){return plusDays(state.startDate,(w-1)*7+d)}
function activeWeek(){return cap(Math.floor(dayDiff(iso(new Date()),state.startDate)/7)+1,1,12)}
function isCardio(code){return Object.hasOwn(CARDIO_INDEX,code)}
function slotDay(code){return ({A:0,B:1,TUE:1,WED:2,C:3,D:4,SAT:5})[code]}

// A weekly schedule is only a map of session IDs to weekdays; logs remain keyed by week + session.
// This means moving a session never loses its sets, cardio history, custom exercises or completion.
function scheduledDay(w,code){
 const assigned=state.weekSchedules?.[String(w)]?.[code];
 return Number.isInteger(assigned)&&assigned>=0&&assigned<=6?assigned:slotDay(code);
}
function weekCodes(w){
 const days=Array.from({length:7},()=>[]);
 for(const code of SESSION_CODES)days[scheduledDay(w,code)].push(code);
 return days;
}
function cleanSchedules(){
 const cleaned={};
 for(const [wk,sessions] of Object.entries(state.weekSchedules||{})){
  if(!/^(?:[1-9]|1[0-2])$/.test(wk)||!sessions||typeof sessions!=='object'||Array.isArray(sessions))continue;
  const map={};for(const code of SESSION_CODES){const day=sessions[code];if(Number.isInteger(day)&&day>=0&&day<=6&&day!==slotDay(code))map[code]=day;}
  if(Object.keys(map).length)cleaned[wk]=map;
 }
 state.weekSchedules=cleaned;
}
function reconcileLogDates(){
 for(const [k,log] of Object.entries(state.logs||{})){
  if(!log||typeof log!=='object')continue;
  const [weekText,code]=k.split('|'),week=Number(weekText);
  if(!SESSION_CODES.includes(code)||!Number.isInteger(week)||week<1||week>12)continue;
  // v3/v4 didn't have manualDate. Preserve completed history and manually chosen dates.
  if(typeof log.manualDate!=='boolean')log.manualDate=!!log.done||(!!log.date&&log.date!==weekDate(week,slotDay(code)));
 }
}
function setAssignedDay(w,code,day){
 if(!SESSION_CODES.includes(code)||!Number.isInteger(day)||day<0||day>6)return false;
 if(scheduledDay(w,code)===day)return false;
 const map=state.weekSchedules[String(w)]||{};
 if(day===slotDay(code))delete map[code];else map[code]=day;
 if(Object.keys(map).length)state.weekSchedules[String(w)]=map;else delete state.weekSchedules[String(w)];
 const log=getLog(w,code);
 if(log){
  // Completed sessions keep the date when they were actually performed.
  if(log.done)log.manualDate=true;
  else if(!log.manualDate)log.date=weekDate(w,day);
 }
 return true;
}
function changeScheduledSession(code,choice){
 const w=state.week;
 if(!SESSION_CODES.includes(code))return;
 const [verb,value]=String(choice).split(':');if(!verb||!value)return;
 if(verb==='move'){
  const day=Number(value);
  if(setAssignedDay(w,code,day)){save();render();toast(SESSION_LABELS[code]+' moved to '+DAYS[day]+' ✓')}
 }else if(verb==='swap'&&SESSION_CODES.includes(value)&&value!==code){
  const firstDay=scheduledDay(w,code),secondDay=scheduledDay(w,value);
  if(firstDay===secondDay)return;
  setAssignedDay(w,code,secondDay);setAssignedDay(w,value,firstDay);
  save();render();toast('Workouts swapped ✓');
 }
}
function resetScheduledWeek(){
 const w=state.week;if(!state.weekSchedules?.[String(w)]){toast('This week already uses the original plan');return;}
 if(!confirm('Reset Week '+w+' to the original day assignments? Existing sets, food, and completed workout dates are kept.'))return;
 for(const code of SESSION_CODES)setAssignedDay(w,code,slotDay(code));
 delete state.weekSchedules[String(w)];save();render();toast('Original weekly schedule restored ✓');
}

function getLog(w,code){return state.logs[key(w,code)]||null}
function customExercises(w,code){const items=getLog(w,code)?.customExercises;return Array.isArray(items)?items:[]}
function sessionLiftExercises(w,code){
 const swaps=getLog(w,code)?.swappedExercises||{};
 return (PLAN.lifts[code]||[]).map(ex=>swaps[ex.id]||ex);
}
function sessionExercise(w,code,id){return sessionLiftExercises(w,code).find(x=>x.id===id)||(PLAN.lifts[code]||[]).find(x=>x.id===id)||customExercises(w,code).find(x=>x.id===id)||null}
function allSessionExercises(w,code){return [...sessionLiftExercises(w,code),...customExercises(w,code)]}
function saveExerciseName(name){name=String(name||'').trim().slice(0,80);if(name&&!state.exerciseLibrary.some(x=>x.toLowerCase()===name.toLowerCase()))state.exerciseLibrary.push(name)}
function exerciseOptions(baseId){const plan=Object.values(PLAN.lifts).flat().filter(x=>x.id!==baseId).map(x=>x.name);const list=[...new Set([...state.exerciseLibrary,...plan])].sort((a,b)=>a.localeCompare(b));return '<option value="">Choose a saved exercise…</option>'+list.map(name=>`<option value="${h(name)}">${h(name)}</option>`).join('')}
function swapForm(baseId,code){const existing=getLog(state.week,code)?.swappedExercises?.[baseId];return `<form id="swap-form" data-base="${h(baseId)}" data-code="${h(code)}" class="swap-panel"><div class="field-label">Replace this exercise for Week ${state.week}</div><select id="swap-pick" class="field">${exerciseOptions(baseId)}</select><label class="field-label" style="margin-top:9px">Or type a different exercise</label><input id="swap-name" class="field" maxlength="80" placeholder="e.g. Dumbbell chest press" value="${h(existing?.name||'')}"/><p class="help">Replaces the planned lift only in this week's session. Previous sets stay in your history.</p><div class="button-row"><button type="submit" class="btn slim">Save substitute</button>${existing?`<button type="button" class="btn ghost slim" data-action="swap-restore" data-code="${h(code)}" data-base="${h(baseId)}">Restore planned lift</button>`:''}<button type="button" class="btn secondary slim" data-action="toggle-swap" data-base="${h(baseId)}">Cancel</button></div></form>`}
function saveSwap(form){const code=form.dataset.code,baseId=form.dataset.base,original=(PLAN.lifts[code]||[]).find(x=>x.id===baseId);if(!original)return;
 const name=(document.getElementById('swap-name').value.trim()||document.getElementById('swap-pick').value.trim()).replace(/\s+/g,' ');
 if(!name||name.length>80){alert('Choose or enter a replacement exercise.');return}
 const log=ensureLog(state.week,code);if(!log.swappedExercises)log.swappedExercises={};
 log.swappedExercises[baseId]={id:'swap-'+baseId,name,originalId:baseId,target:original.target,equipment:'Available equipment',cue:'Use controlled technique and a comparable effort.',custom:true};
 saveExerciseName(name);swapTarget=null;save();render();toast(name+' substituted for this week ✓');
}
function restoreSwap(code,baseId){const log=getLog(state.week,code);if(log?.swappedExercises?.[baseId]){delete log.swappedExercises[baseId];swapTarget=null;save();render();toast('Planned lift restored; past sets retained')}}

cleanSchedules();reconcileLogDates();

function ensureLog(w,code){const k=key(w,code);if(!state.logs[k])state.logs[k]={date:weekDate(w,scheduledDay(w,code)),manualDate:false,done:false,notes:'',exercises:{},minutes:'',distance:'',rpe:'',machine:'Bike'};return state.logs[k]}

function foodsFor(date){return (state.foods||[]).filter(x=>x.date===date).sort((a,b)=>MEALS.indexOf(a.meal)-MEALS.indexOf(b.meal)||String(a.created||'').localeCompare(String(b.created||'')))}

 <section class="panel" id="food-entry-form"><div class="row"><h2>${editing?'Edit food':'Quick-add food'}</h2>${editing?'<button class="mini-btn" type="button" data-action="food-cancel-edit">Cancel</button>':''}</div><form id="food-form"><div class="food-form-grid" style="margin-top:16px"><label><span class="field-label">Meal</span><select class="field" id="food-meal">${MEALS.map(m=>`<option value="${m}" ${(entry.meal||'Breakfast')===m?'selected':''}>${m}</option>`).join('')}</select></label><label><span class="field-label">Portion / serving</span><input class="field" id="food-serving" type="text" maxlength="80" placeholder="e.g. 1 cup" value="${h(entry.serving||'')}"/></label><label class="span-all"><span class="field-label">Food or drink</span><input class="field" id="food-name" type="text" maxlength="130" required placeholder="e.g. Greek yogurt, banana" value="${h(entry.name||'')}"/></label><label><span class="field-label">Calories (kcal)</span><input class="field" id="food-calories" type="number" inputmode="decimal" step="1" min="0" max="20000" placeholder="Optional" value="${h(entry.calories??'')}"/></label><label><span class="field-label">Protein (g)</span><input class="field" id="food-protein" type="number" inputmode="decimal" step="0.1" min="0" max="1000" placeholder="Optional" value="${h(entry.protein??'')}"/></label><label><span class="field-label">Carbs (g)</span><input class="field" id="food-carbs" type="number" inputmode="decimal" step="0.1" min="0" max="1000" placeholder="Optional" value="${h(entry.carbs??'')}"/></label><label><span class="field-label">Fat (g)</span><input class="field" id="food-fat" type="number" inputmode="decimal" step="0.1" min="0" max="1000" placeholder="Optional" value="${h(entry.fat??'')}"/></label></div><button class="btn full" type="submit" style="margin-top:15px">${editing?'✓ Save changes':'+ Add food'}</button></form><p class="help">Enter nutrition from packaging or your own estimates. You can leave any numeric field blank and fill it in later.</p></section>`;
 if(recent.length){html+=`<div class="section-head"><h2>Log again</h2><span class="tiny muted">Your recently used foods</span></div><section class="panel">${recent.map(x=>`<div class="food-quick"><div style="min-width:0"><strong>${h(x.name)}</strong><div class="muted">${h(x.serving||'No serving listed')} · ${x.calories!==''&&x.calories!=null?h(x.calories)+' kcal':'calories not entered'}</div></div><button type="button" class="btn secondary slim" data-action="food-repeat" data-id="${h(x.id)}" aria-label="Log ${h(x.name)} again">+ Log</button></div>`).join('')}</section>`}

function addOrEditFood(){const name=document.getElementById('food-name').value.trim(),serving=document.getElementById('food-serving').value.trim(),meal=document.getElementById('food-meal').value;if(!name){alert('Enter a food or drink name.');return}if(!MEALS.includes(meal))return;

}

function exportFoodCSV(){const rows=[['Date','Meal','Food','Serving','Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)']];for(const f of state.foods.slice().sort((a,b)=>a.date.localeCompare(b.date)))rows.push([f.date,f.meal,f.name,f.serving||'',f.calories??'',f.protein??'',f.carbs??'',f.fat??'']);download('Field_Ready_Food_Log.csv','\ufeff'+rows.map(row=>row.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('Food log exported')}

function renderToday(){const w=state.week,p=phase(w),sel=state.day,day=weekDate(w,sel),total=countDone(w),days=weekCodes(w);const today=iso(new Date());const matching=weekDate(w,sel)===today;let html=`<section class="page-intro"><div class="eyebrow">YOUR TRAINING HOME</div><h1>Build strength.<br/><span class="green">Own the field.</span></h1><p>12 weeks of lifting, cardio and athletic power. No league games required.</p></section><section class="hero"><div class="row" style="justify-content:flex-start;gap:8px"><span class="pill">WEEK ${w} OF 12</span><span class="pill ${p.phase==='DELOAD'?'orange':'gray'}">${h(p.phase)}</span></div><h2 style="font-size:24px;margin:17px 0 5px">Your weekly game plan</h2><p class="sub">${h(p.liftFocus)}. ${p.phase==='DELOAD'?'Lower volume this week.':'Consistency beats maxing out.'}</p><div style="margin-top:17px" class="row"><span class="small">${total} / 7 sessions logged</span><span class="small strong">${Math.round(total/7*100)}%</span></div><div class="progress-bar" style="margin-top:8px"><div class="progress-fill" style="width:${Math.round(total/7*100)}%"></div></div></section><div class="stat-grid"><div class="stat"><div class="number">${total}<span class="muted" style="font-size:16px">/7</span></div><div class="label">THIS WEEK</div></div><div class="stat"><div class="number">${cardioMin(w)}<span class="muted" style="font-size:13px"> min</span></div><div class="label">CARDIO</div></div><div class="stat"><div class="number">${state.weights.length?Number(state.weights[state.weights.length-1].weight).toFixed(1):'—'}</div><div class="label">LATEST LB</div></div></div>${weekNav()}<div class="schedule-tool-row"><button class="btn secondary slim" data-action="rearrange-week">↔ Rearrange week</button><span class="tiny muted">Change this week's workout days</span></div>${weekStrip()}${quickStartLifts()}<div class="section-head"><h2>${matching?'Today':pretty(day,{weekday:'long',month:'short',day:'numeric'})}</h2><span class="muted small">${days[sel].length} planned ${days[sel].length===1?'session':'sessions'}</span></div>`;
  html+=(days[sel].length?days[sel].map(c=>card(w,c)).join(''):emptyDay());
  const next=days.map((codes,i)=>({i,codes})).filter(x=>x.codes.length&&x.i!==sel&&x.codes.some(c=>!codeDone(w,c))).slice(0,3);

  const foodNow=foodTotals(today);html+=`<div class="section-head"><h2>Today's food</h2><button type="button" class="text-button" data-nav="food">Open food log ›</button></div><section class="panel"><div class="row"><div><strong style="font-size:20px">${nutrientText(foodNow,'calories')} <span class="muted small">kcal</span></strong><p class="help">${foodNow.entries.length} items logged</p></div><div><strong style="font-size:20px">${nutrientText(foodNow,'protein')} <span class="muted small">g</span></strong><p class="help">Protein</p></div><button type="button" class="btn secondary slim" data-nav="food">+ Food</button></div></section>`;

}
function renderPlan(){const w=state.week,days=weekCodes(w);let html=`<div class="page-intro"><div class="eyebrow">THE PROGRAM</div><h1>12 weeks.<br/><span class="green">Your pace.</span></h1><p>4 gym lifting sessions (6–7 movements each), 3 machine-cardio sessions, and a recovery day each week.</p></div>${weekNav()}<div class="schedule-tool-row"><button class="btn secondary slim" data-action="rearrange-week">↔ Rearrange week</button><span class="tiny muted">Adjust Week ${w} only</span></div><div class="alert ${phase(w).phase==='DELOAD'?'warn':''}"><b>${h(phase(w).phase)} • Week ${w}</b><br/>${h(phase(w).liftFocus)}${phase(w).phase==='DELOAD'?'<br/>Reduce lifting sets 30–40% and keep Saturday cardio easy.':''}</div>`;

function renderSchedule(){

function exSets(w,code,ex){const log=getLog(w,code);const existing=log?.exercises?.[ex.id]?.sets;if(existing&&Array.isArray(existing)&&existing.length)return existing;const standard=Number((ex.target||'3').match(/^\d+/)?.[0])||3;const n=phase(w).phase==='DELOAD'?Math.max(1,Math.ceil(standard*.65)):standard;return Array.from({length:n},()=>({reps:'',load:''}))}

window.FieldReadyApp={getPayload(){const keys=['version','startDate','logs','weekSchedules','weights','goalWeight','name','foods','nutritionGoals','exerciseLibrary'];const o={};for(const k of keys)o[k]=state[k];return JSON.parse(JSON.stringify(o))},getStats(){return {sessions:Object.keys(state.logs||{}).length,foods:state.foods.length,weights:state.weights.length,custom:Object.keys(state.weekSchedules||{}).length}},adoptPayload(data){if(!data||data.version!==1||!data.logs||!Array.isArray(data.foods)||!Array.isArray(data.weights))throw Error('Invalid backup data');for(const k of ['version','startDate','logs','weekSchedules','weights','goalWeight','name','foods','nutritionGoals','exerciseLibrary'])if(Object.hasOwn(data,k))state[k]=JSON.parse(JSON.stringify(data[k]));if(!Array.isArray(state.exerciseLibrary))state.exerciseLibrary=[];cleanSchedules();reconcileLogDates();save();render()},backup(){download('Field_Ready_Pre_Cloud_Restore_'+iso(new Date())+'.json',JSON.stringify(state,null,2),'application/json')},render,toast};
function renderMore(){return `<div class="page-intro"><div class="eyebrow">YOUR SETTINGS</div><h1>Make it<br/><span class="green">yours.</span></h1><p>Adjust your start date, export your workout logs, and protect your data.</p></div><section class="panel"><h3>Program setup</h3><label class="field-label" style="margin-top:16px" for="start-date">Week 1 begins on Monday</label><input class="field" id="start-date" type="date" value="${h(state.startDate)}" data-setting="start-date" /><p class="help">Changing the start date changes workout dates, not your logged week numbers. The plan has 12 weeks.</p><label class="field-label" style="margin-top:16px" for="goal-weight">Optional goal weight (lb)</label><input class="field" id="goal-weight" type="number" step="0.1" min="50" max="900" placeholder="Leave blank if you prefer" value="${h(state.goalWeight)}" data-setting="goal-weight"/></section><div class="section-head"><h2>Optional food targets</h2></div><section class="panel"><label class="field-label" for="nutrition-goal-calories">Daily calories (kcal)</label><input class="field" id="nutrition-goal-calories" type="number" min="0" max="10000" step="1" placeholder="No target set" value="${h(state.nutritionGoals.calories||'')}" data-setting="nutrition-calories"/><label class="field-label" style="margin-top:15px" for="nutrition-goal-protein">Daily protein (g)</label><input class="field" id="nutrition-goal-protein" type="number" min="0" max="500" step="1" placeholder="No target set" value="${h(state.nutritionGoals.protein||'')}" data-setting="nutrition-protein"/><p class="help">Targets are optional. Set them based on your own plan or advice from your care team; none are prefilled.</p></section><div class="section-head"><h2>Cloud backup and sync</h2></div><section id="cloud-panel" class="cloud-panel"><h3>Local mode</h3><p class="cloud-small">Your data stays on this device until cloud sync is configured and you sign in. Existing backups continue to work.</p></section><div class="section-head"><h2>Google Sheets and backup</h2></div><section class="panel"><div class="button-row"><button class="btn" data-action="export-csv">↓ Export Sheets CSV</button><button class="btn secondary" data-action="export-food-csv">↓ Food-only CSV</button><button class="btn secondary" data-action="backup-json">↓ Full data backup</button><button class="btn secondary" data-action="restore-json">↑ Restore backup</button></div><input id="restore-file" class="file-input" type="file" accept="application/json,.json" aria-label="Import backup file"/><p class="help">The full CSV includes lifting, cardio, weigh-ins, and food. The food-only CSV is easier to analyze in a separate Google Sheet. JSON backs up everything, including drafts, your per-week schedule changes, and settings. <b>Google Sheets remains manual CSV export. Optional Firebase cloud sync is separate and only works after configuration and sign-in.</b></p></section><p class="cloud-small">Field Ready v${APP_RELEASE} · Locally saved first, cloud optional.</p><div class="section-head"><h2>Install on your phone</h2></div><div class="install-info"><p class="small" style="margin:0 0 9px"><b>iPhone:</b> Once the app is hosted on HTTPS, open its URL in Safari → Share → Add to Home Screen.</p><p class="small" style="margin:0"><b>Android:</b> Open in Chrome → menu → Install app or Add to Home screen.</p><p class="help">When hosted, the app is available offline after its first load. Without cloud sign-in, data stays in each browser/device unless you export and restore a backup.</p></div><div class="section-head"><h2>Training reminders</h2></div><div class="alert">Focus on technique, consistent effort, and recovery. Weeks 4, 8, and 12 are lighter. During cardio, keep water available and monitor how you feel. If you use insulin or a glucose monitor, follow your exercise glucose-safety plan and keep fast carbohydrates available.</div><div class="section-head"><h2>About your training plan</h2></div><section class="panel"><p class="small muted" style="margin-top:0">Built from your 12-week Ultimate Frisbee Lean + Explosive spreadsheet, including 27 Planet Fitness-compatible movements, YouTube technique links, and 36 planned cardio sessions.</p><button class="btn ghost slim" data-action="go-current">Jump to current week</button></section>`}
function render(){let content='';if(state.view==='session'&&state.session)content=renderSession();else if(state.view==='guide'&&state.session)content=renderGuide();else if(state.view==='plan')content=renderPlan();else if(state.view==='schedule')content=renderSchedule();else if(state.view==='progress')content=renderProgress();else if(state.view==='food')content=renderFood();else if(state.view==='more')content=renderMore();else content=renderToday();document.getElementById('main').innerHTML=content;renderNav();window.FieldReadyCloud?.paint?.();updateRestDisplay()}
function addExerciseSet(code,id,remove=false){const ex=sessionExercise(state.week,code,id);if(!ex)return;const log=ensureLog(state.week,code);const e=log.exercises[id]||{sets:exSets(state.week,code,ex).map(s=>({...s})),rpe:''};if(remove){if(e.sets.length>1)e.sets.pop()}else if(e.sets.length<10)e.sets.push({reps:'',load:''});log.exercises[id]=e;save();render()}
function updateEntry(node){const type=node.dataset.entry,code=node.dataset.code;if(!code)return;const log=ensureLog(state.week,code);if(type==='reps'||type==='load'||type==='ex-rpe'){
  const exId=node.dataset.ex,ex=sessionExercise(state.week,code,exId);if(!ex)return;const o=log.exercises[exId]||{sets:exSets(state.week,code,ex).map(s=>({...s})),rpe:''};if(type==='ex-rpe')o.rpe=node.value;else{const i=Number(node.dataset.set);while(o.sets.length<=i)o.sets.push({reps:'',load:''});o.sets[i][type]=node.value}log.exercises[exId]=o;
 }else if(type==='session-date'){log.date=node.value||weekDate(state.week,scheduledDay(state.week,code));log.manualDate=log.date!==weekDate(state.week,scheduledDay(state.week,code))}else if(type==='session-notes')log.notes=node.value;else if(['minutes','distance','rpe','machine'].includes(type))log[type]=node.value;save()}
function addCustomExercise(form){
  const code=form.dataset.code;if(!PLAN.lifts[code])return;
  const name=form.elements.name.value.trim().replace(/\s+/g,' ');
  const n=Number(form.elements.sets.value);
  if(!name||name.length>80||!Number.isInteger(n)||n<1||n>10){alert('Please enter an exercise name and 1–10 sets.');return}
  const reps=form.elements.reps.value.trim();const load=form.elements.load.value;
  if(reps.length>30||load!==''&&(!Number.isFinite(Number(load))||Number(load)<0||Number(load)>5000)){alert('Please check the reps and weight.');return}
  const log=ensureLog(state.week,code);if(!Array.isArray(log.customExercises))log.customExercises=[];
  if(log.customExercises.length>=20){alert('This day already has 20 added exercises.');return}
  const id='custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
  log.customExercises.push({id,name,target:n+' sets',custom:true});saveExerciseName(name);
  const sets=Array.from({length:n},()=>({reps:'',load:''}));sets[0]={reps,load};
  log.exercises[id]={sets,rpe:''};
  showCustomExerciseForm=false;save();render();
  document.getElementById('custom-card-'+id)?.scrollIntoView({block:'center',behavior:'smooth'});
  toast(name+' added to this day ✓');
}
function removeCustomExercise(code,id){
  const log=getLog(state.week,code),ex=customExercises(state.week,code).find(x=>x.id===id);
  if(!log||!ex||!confirm('Remove '+ex.name+' and its logged sets from this workout?'))return;
  log.customExercises=log.customExercises.filter(x=>x.id!==id);
  delete log.exercises?.[id];save();render();toast('Exercise removed');
}
function download(filename,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvEscape(v){const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}
function exportCSV(){const rows=[['Date','Week','Type','Session','Exercise','Set','Reps / Seconds','Load (lb)','RPE','Minutes','Distance (miles)','Cardio Machine','Notes','Completed','Meal','Serving','Calories (kcal)','Protein (g)','Carbs (g)','Fat (g)']];for(const [k,log] of Object.entries(state.logs)){
  const [weekRaw,code]=k.split('|'),w=Number(weekRaw),date=log.date||weekDate(w,scheduledDay(w,code));if(isCardio(code)){if(log.done||log.minutes||log.notes)rows.push([date,w,'Cardio',SESSION_LABELS[code],'','','','',''+(log.rpe||''),log.minutes||'',log.distance||'',log.machine||'',log.notes||'',log.done?'Yes':'No'])}
  else{let wrote=false;for(const ex of [...(PLAN.lifts[code]||[]),...Object.values(log.swappedExercises||{}),...(Array.isArray(log.customExercises)?log.customExercises:[])]){const e=log.exercises?.[ex.id];if(!e)continue;for(let i=0;i<(e.sets||[]).length;i++){const s=e.sets[i];if(s.reps||s.load||e.rpe){rows.push([date,w,'Strength',SESSION_LABELS[code],ex.name,i+1,s.reps||'',s.load||'',e.rpe||'','','','',log.notes||'',log.done?'Yes':'No']);wrote=true}}}if(!wrote&&(log.done||log.notes))rows.push([date,w,'Strength',SESSION_LABELS[code],'','','','','','','','',log.notes||'',log.done?'Yes':'No'])}
 }for(const v of state.weights)rows.push([v.date,'','Weigh-in','','Body weight','','',v.weight||'','','','','',`Waist: ${v.waist||''} in. ${v.notes||''}`,'']);for(const f of state.foods||[])rows.push([f.date,'','Food',f.meal,f.name,'','','','','','','','','',f.meal,f.serving||'',f.calories??'',f.protein??'',f.carbs??'',f.fat??'']);const csv='\ufeff'+rows.map(row=>{while(row.length<20)row.push('');return row.map(csvEscape).join(',')}).join('\r\n');download('Field_Ready_Google_Sheets_Export.csv',csv,'text/csv;charset=utf-8');toast('CSV exported')}
async function importJSON(file){try{const obj=JSON.parse(await file.text());if(obj.version!==1||typeof obj.startDate!=='string'||!Array.isArray(obj.weights)||typeof obj.logs!=='object'||!obj.logs)throw new Error('Unrecognized backup');if(!confirm('Restore this backup? Current data on this device will be replaced.'))return;state=Object.assign(initial(),obj);if(!Array.isArray(state.foods))state.foods=[];if(!Array.isArray(state.exerciseLibrary))state.exerciseLibrary=[];if(!state.nutritionGoals||typeof state.nutritionGoals!=='object')state.nutritionGoals={calories:'',protein:''};if(!state.weekSchedules||typeof state.weekSchedules!=='object'||Array.isArray(state.weekSchedules))state.weekSchedules={};cleanSchedules();reconcileLogDates();state.foodEditId=null;state.week=cap(Number(state.week)||1,1,12);state.day=cap(Number(state.day)||0,0,6);state.view='today';save();render();toast('Backup restored')}catch(err){alert('Could not import this backup. Please select a Field Ready JSON export.')}}
function addWeight(){const date=document.getElementById('weight-date').value,weight=document.getElementById('weight-value').value,waist=document.getElementById('weight-waist').value,notes=document.getElementById('weight-notes').value;if(!date||!weight||Number(weight)<50||Number(weight)>900){alert('Enter a valid date and weight in pounds.');return}const id='weight-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);state.weights.push({id,date,weight,waist,notes});state.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render();toast('Weigh-in saved')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.nav){goView(t.dataset.nav);return}
 if(t.dataset.open){openSession(Number(t.dataset.week),t.dataset.open);return}
 const action=t.dataset.action;
 if(action==='open-guide'){state.view='guide';state.guideIndex=0;save();render();window.scrollTo(0,0);return}
 if(action==='guide-back'){state.view='session';save();render();return}
 if(action==='guide-prev'||action==='guide-next'){const n=allSessionExercises(state.week,state.session).length;state.guideIndex=cap(Number(state.guideIndex||0)+(action==='guide-next'?1:-1),0,Math.max(0,n-1));save();render();window.scrollTo(0,0);return}
 if(action==='guide-set'){toggleGuideSet(t.dataset.ex,Number(t.dataset.set));return}
 if(action==='guide-finish'){const log=ensureLog(state.week,state.session);log.done=true;state.view='session';save();render();toast('Workout finished ✓');return}
 if(action==='rest-start'){startRest(Number(t.dataset.seconds)||90);return}
 if(action==='rest-skip'){clearRest();return}
 if(action==='toggle-swap'){swapTarget=swapTarget===t.dataset.base?null:t.dataset.base;render();return}
 if(action==='swap-restore'){restoreSwap(t.dataset.code,t.dataset.base);return}
 if(action==='rearrange-week'){state.scheduleReturnView=state.view==='plan'?'plan':'today';goView('schedule');return}
 if(action==='schedule-done'){goView(state.scheduleReturnView==='plan'?'plan':'today');return}
 if(action==='reset-schedule'){resetScheduledWeek();return}
 if(action==='week-prev'||action==='week-next'){setWeek(state.week+(action==='week-prev'?-1:1));return}
 if(action==='day'){state.day=Number(t.dataset.day);save();render();return}
 if(action==='back'){goView(state.previousView||'today');return}
 if(action==='add-set'||action==='remove-set'){addExerciseSet(t.dataset.code,t.dataset.ex,action==='remove-set');return}
 if(action==='toggle-custom-exercise'){showCustomExerciseForm=!showCustomExerciseForm;render();if(showCustomExerciseForm){document.getElementById('custom-ex-name')?.focus();document.getElementById('custom-exercise-form')?.scrollIntoView({block:'nearest',behavior:'smooth'})}return}
 if(action==='remove-custom-exercise'){removeCustomExercise(t.dataset.code,t.dataset.ex);return}
 if(action==='toggle-done'){const log=ensureLog(state.week,t.dataset.code);log.done=!log.done;save();render();toast(log.done?'Workout completed ✓':'Session reopened');return}
 if(action==='food-prev'){changeFoodDate(plusDays(state.foodDate,-1));return}
 if(action==='food-next'){changeFoodDate(plusDays(state.foodDate,1));return}
 if(action==='food-today'){changeFoodDate(iso(new Date()));return}
 if(action==='food-repeat'){repeatFood(t.dataset.id);return}
 if(action==='food-edit'){const entry=state.foods.find(x=>x.id===t.dataset.id);if(entry){state.foodDate=entry.date;state.foodEditId=entry.id;save();render();document.getElementById('food-entry-form')?.scrollIntoView({block:'start',behavior:'smooth'})}return}
 if(action==='food-cancel-edit'){state.foodEditId=null;save();render();return}
 if(action==='food-delete'){if(!confirm('Remove this food entry?'))return;state.foods=state.foods.filter(x=>x.id!==t.dataset.id);if(state.foodEditId===t.dataset.id)state.foodEditId=null;save();render();toast('Food removed');return}
 if(action==='add-weight'){addWeight();return}
 if(action==='delete-weight'){if(!confirm('Remove this weigh-in?'))return;state.weights=state.weights.filter(x=>x.id!==t.dataset.id);save();render();return}
 if(action==='export-csv'){exportCSV();return}
 if(action==='export-food-csv'){exportFoodCSV();return}
 if(action==='backup-json'){download('Field_Ready_Full_Backup.json',JSON.stringify(state,null,2),'application/json');toast('Backup exported');return}
 if(action==='restore-json'){document.getElementById('restore-file').click();return}
 if(action==='go-current'){state.week=activeWeek();state.day=cap((toDate(iso(new Date())).getDay()+6)%7,0,6);goView('today');return}
});
document.addEventListener('submit',e=>{if(e.target.id==='food-form'){e.preventDefault();addOrEditFood()}else if(e.target.id==='custom-exercise-form'){e.preventDefault();addCustomExercise(e.target)}else if(e.target.id==='swap-form'){e.preventDefault();saveSwap(e.target)}});
document.addEventListener('change',e=>{const n=e.target;if(n.dataset.scheduleCode){changeScheduledSession(n.dataset.scheduleCode,n.value);return}if(n.dataset.entry)updateEntry(n);if(n.dataset.setting==='start-date'){const v=n.value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)){state.startDate=mondayOf(v);save();toast('Start date updated')}else alert('Select a valid date')}if(n.dataset.setting==='goal-weight'){state.goalWeight=n.value;save()}if(n.id==='food-date'){changeFoodDate(n.value)}if(n.dataset.setting==='nutrition-calories'||n.dataset.setting==='nutrition-protein'){const k=n.dataset.setting==='nutrition-calories'?'calories':'protein';const val=n.value;if(val!==''&&(Number(val)<0||Number(val)>(k==='calories'?10000:500))){alert('Please enter a valid number.');return}state.nutritionGoals[k]=val;save()}if(n.id==='restore-file'&&n.files?.[0])importJSON(n.files[0])});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
  const maybeUpdate=()=>{if(reg.waiting&&navigator.serviceWorker.controller)showUpdatePrompt(reg)};
  maybeUpdate();reg.addEventListener('updatefound',()=>reg.installing?.addEventListener('statechange',maybeUpdate));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
 }).catch(()=>{});
}
